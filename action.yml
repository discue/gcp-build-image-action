name: "GCP Build Image"
description: "Build and push container images to Google Cloud using Cloud Build"
author: "discue"

inputs:
  image:
    description: "The full image URL to build (e.g., europe-west3-docker.pkg.dev/project/repository/image)"
    required: true

  region:
    description: "Google Cloud region to use for the build (e.g., europe-west3). If not set, defaults to the gcloud default region."
    required: false

  impersonate:
    description: "Service account email to impersonate to submit the gcloud build. If not set, uses the default credentials."
    required: false

  build_service_account:
    description: "Service account email to use for the Cloud Build execution. If not set, uses the default Cloud Build service account."
    required: false

  quiet:
    description: "Run in quiet mode. Suppress all non-error output. Default is true."
    required: false
    default: "true"

  source:
    description: "Source directory to build (relative to the repository root). Default is the repository root."
    required: false
    default: "."

  builder:
    description: "Build method: '' (default for autodetection), 'cloudbuild', 'buildpack' or 'dockerfile'"
    required: false
    default: ""

  staging_bucket_name:
    description: "Cloud Storage bucket name to use for staging (without gs:// or path). If empty, defaults to GCP default e.g. $project_$region_cloudbuild."
    required: false
    default: ""

  staging_bucket_dir:
    description: "Directory within the Cloud Storage bucket to use for staging. Defaults to 'builds'."
    required: false
    default: "builds"

  substitutions:
    description: "Parameters to be substituted in the build specification (multiline KEY=VALUE or comma-separated KEY=VALUE)."
    required: false
    default: ""

outputs:
  image-url:
    description: "The built image URL"
    value: ${{ steps.build.outputs.image-url }}

runs:
  using: "composite"
  steps:
    - name: Build image with Cloud Build
      id: build
      shell: bash
      env:
        INPUT_STAGING_BUCKET_NAME: ${{ inputs.staging_bucket_name }}
        INPUT_STAGING_BUCKET_DIR: ${{ inputs.staging_bucket_dir }}
        INPUT_BUILDER: ${{ inputs.builder }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_IMPERSONATE: ${{ inputs.impersonate }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_BUILD_SERVICE_ACCOUNT: ${{ inputs.build_service_account }}
        INPUT_SUBSTITUTIONS: ${{ inputs.substitutions }}
      run: |
        set -euo pipefail

        # Initialize all variables at the beginning
        BUCKET_NAME_INPUT="${INPUT_STAGING_BUCKET_NAME:-}"
        BUCKET_DIR_INPUT="${INPUT_STAGING_BUCKET_DIR:-builds}"
        BUILDER_INPUT="${INPUT_BUILDER:-}"
        IMAGE_INPUT="${INPUT_IMAGE}"
        IMPERSONATE_INPUT="${INPUT_IMPERSONATE:-}"
        QUIET_INPUT="${INPUT_QUIET:-true}"
        REGION_INPUT="${INPUT_REGION:-}"
        SOURCE_INPUT="${INPUT_SOURCE:-.}"
        BUILD_SERVICE_ACCOUNT_INPUT="${INPUT_BUILD_SERVICE_ACCOUNT:-}"
        SUBSTITUTIONS_INPUT="${INPUT_SUBSTITUTIONS:-}"

        ARGS=()

        QUIET_FLAG=""
        if [[ "$QUIET_INPUT" == "true" ]]; then
          QUIET_FLAG="--quiet"
          ARGS+=("$QUIET_FLAG")
        fi

        IMPERSONATE_FLAG=""
        if [[ -n "$IMPERSONATE_INPUT" ]]; then
          IMPERSONATE_FLAG="--impersonate-service-account=$IMPERSONATE_INPUT"
          ARGS+=("$IMPERSONATE_FLAG")
        fi

        if [[ -n "$REGION_INPUT" ]]; then
          gcloud config set builds/region "$REGION_INPUT"
        fi

        GCS_BUCKET=""
        GCS_BUCKET_FLAG=""
        if [[ -n "$BUCKET_NAME_INPUT" ]]; then
          GCS_BUCKET="gs://${BUCKET_NAME_INPUT}"
          GCS_BUCKET_FLAG="--gcs-source-staging-dir=${GCS_BUCKET}/${BUCKET_DIR_INPUT}"
          ARGS+=("$GCS_BUCKET_FLAG")
        fi

        CONFIG_FILE="$SOURCE_INPUT/cloudbuild.yaml"
        if [[ ! -f "$CONFIG_FILE" && -f "cloudbuild.yaml" ]]; then
          CONFIG_FILE="cloudbuild.yaml"
        fi

        BUILD_METHOD="$BUILDER_INPUT"
        if [[ -z "$BUILD_METHOD" ]]; then
          if [[ -f "$CONFIG_FILE" ]]; then
            BUILD_METHOD="cloudbuild"
          elif [[ -f "$SOURCE_INPUT/Dockerfile" ]]; then
            BUILD_METHOD="dockerfile"
          else
            BUILD_METHOD="buildpack"
          fi
        fi

        BUILD_FLAG=""
        if [[ "$BUILD_METHOD" == "cloudbuild" ]]; then
          BUILD_FLAG="--config=${CONFIG_FILE}"
          ARGS+=("$BUILD_FLAG")
        elif [[ "$BUILD_METHOD" == "dockerfile" ]]; then
          BUILD_FLAG="--tag=${IMAGE_INPUT}"
          ARGS+=("$BUILD_FLAG")
        elif [[ "$BUILD_METHOD" == "buildpack" ]]; then
          BUILD_FLAG="--pack image=${IMAGE_INPUT}"
          ARGS+=("--pack" "image=${IMAGE_INPUT}")
        else
          echo "::error::Invalid builder '${BUILD_METHOD}'. Must be 'cloudbuild', 'dockerfile', 'buildpack', or ''."
          exit 1
        fi

        echo "Building image: $IMAGE_INPUT"
        echo "Source directory: $SOURCE_INPUT"
        ls -l -- "$SOURCE_INPUT"

        BUILD_SERVICE_ACCOUNT_FLAG=""
        if [[ -n "$BUILD_SERVICE_ACCOUNT_INPUT" ]]; then
          BUILD_SERVICE_ACCOUNT_FLAG="--service-account=$BUILD_SERVICE_ACCOUNT_INPUT"
          ARGS+=("$BUILD_SERVICE_ACCOUNT_FLAG")
        fi

        SUBSTITUTIONS_FLAG=""
        if [[ -n "$SUBSTITUTIONS_INPUT" ]]; then
          SUBSTITUTIONS_JOINED=""
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            if [[ -n "$line" ]]; then
              if [[ -z "$SUBSTITUTIONS_JOINED" ]]; then
                SUBSTITUTIONS_JOINED="$line"
              else
                SUBSTITUTIONS_JOINED="${SUBSTITUTIONS_JOINED},${line}"
              fi
            fi
          done <<< "$SUBSTITUTIONS_INPUT"
          if [[ -n "$SUBSTITUTIONS_JOINED" ]]; then
            SUBSTITUTIONS_FLAG="--substitutions=$SUBSTITUTIONS_JOINED"
            ARGS+=("$SUBSTITUTIONS_FLAG")
          fi
        fi

        # Merge all flags just before the submit command
        FLAGS="${QUIET_FLAG} ${IMPERSONATE_FLAG} ${BUILD_FLAG} ${GCS_BUCKET_FLAG} ${BUILD_SERVICE_ACCOUNT_FLAG} ${SUBSTITUTIONS_FLAG}"
        gcloud builds submit "${ARGS[@]}" -- "$SOURCE_INPUT"

        echo "image-url=${IMAGE_INPUT}" >> "$GITHUB_OUTPUT"
        echo "Successfully built image: $IMAGE_INPUT"

branding:
  icon: "package"
  color: "green"
